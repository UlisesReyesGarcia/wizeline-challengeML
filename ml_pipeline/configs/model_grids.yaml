target_column: target

test_size: 0.2
random_state: 42
cv_folds: 5

primary_metric: rmse

promotion:
  min_improvement_pct: 0.0

models:
  linear_regression:
    enabled: true
    type: sklearn.linear_model.LinearRegression
    param_grid:
      fit_intercept: [true, false]

  ridge:
    enabled: true
    type: sklearn.linear_model.Ridge
    param_grid:
      alpha: [0.01, 0.1, 1.0, 10.0, 100.0]
      fit_intercept: [true, false]

  lasso:
    enabled: true
    type: sklearn.linear_model.Lasso
    param_grid:
      alpha: [0.001, 0.01, 0.1, 1.0]
      fit_intercept: [true, false]
      max_iter: [10000]

  elasticnet:
    enabled: true
    type: sklearn.linear_model.ElasticNet
    param_grid:
      alpha: [0.001, 0.01, 0.1, 1.0]
      l1_ratio: [0.2, 0.5, 0.8]
      fit_intercept: [true, false]
      max_iter: [10000]

  random_forest:
    enabled: true
    type: sklearn.ensemble.RandomForestRegressor
    param_grid:
      n_estimators: [100, 200]
      max_depth: [null, 5, 10]
      min_samples_split: [2, 5]
      random_state: [42]
      n_jobs: [-1]

  gradient_boosting:
    enabled: true
    type: sklearn.ensemble.GradientBoostingRegressor
    param_grid:
      n_estimators: [100, 200]
      learning_rate: [0.05, 0.1]
      max_depth: [2, 3]
      random_state: [42]

  xgboost:
    enabled: true
    type: xgboost.XGBRegressor
    param_grid:
      n_estimators: [100, 200]
      max_depth: [2, 3, 5]
      learning_rate: [0.05, 0.1]
      subsample: [0.8, 1.0]
      colsample_bytree: [0.8, 1.0]
      objective: ["reg:squarederror"]
      random_state: [42]
      n_jobs: [-1]
